viewmodelCompose = "2.9.3"
navigationCompose = "2.9.3"
koinAndroid = "4.1.0"
kotlinSerializationJson = "1.9.0"
biometric = "1.4.0-alpha02"
protobuf = "3.25.5"
protobufPlugin = "0.10.0"
coil = "2.7.0"
zxing = "4.3.0"
onetimepassword="2.4.1"
accompanist="0.37.3"

[libraries]
androidx-biometric-ktx = { group = "androidx.biometric", name = "biometric-ktx", version.ref = "biometric" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version = "1.23.0" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
