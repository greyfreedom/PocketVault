name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint, and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify source and release manifest
        run: >-
          ./gradlew
          :app:compileGooglePlayDebugKotlin
          :app:testGooglePlayDebugUnitTest
          :app:lintGooglePlayDebug
          :app:processGooglePlayReleaseMainManifest
          --stacktrace

      - name: Verify published privacy policy is current
        run: cmp app/src/main/assets/privacy_policy.html docs/privacy_policy.html

      - name: Reject network and Firebase declarations
        shell: bash
        run: |
          play_manifest="$(find app/build/intermediates/merged_manifest/googlePlayRelease -name AndroidManifest.xml -print -quit)"
          if [[ -z "$play_manifest" ]]; then
            echo "The merged Google Play release manifest was not generated."
            exit 1
          fi
          if grep -Eiq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)|firebase|crashlytics' "$play_manifest"; then
            echo "Unexpected network permission or Firebase declaration found in $play_manifest"
            grep -Ein 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)|firebase|crashlytics' "$play_manifest"
            exit 1
          fi
          grep -q 'package="com.turisla.hellopocket"' "$play_manifest"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
